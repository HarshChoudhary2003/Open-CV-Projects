# Docker Compose - VisionAI Platform

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./snapshots:/app/snapshots
      - ./logs:/app/logs
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./visionai.db
    devices:
      - /dev/video0:/dev/video0    # Webcam passthrough (Linux)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: visionai-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  visionai_db:
